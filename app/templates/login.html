{% extends "base.html" %}

{% block auth_content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="row justify-content-center w-100">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card border-0 overflow-hidden position-relative p-2">
                <!-- Bouton Retour -->
                <a href="{{ url_for('main.index') }}" class="btn btn-sm btn-secondary position-absolute top-0 start-0 m-3 rounded-circle shadow-sm" style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; z-index: 10;" title="Retour à l'accueil">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div class="card-body p-4 p-md-5 text-center">
                    
                    <!-- Logo -->
                    <div class="auth-logo-box mb-4 mx-auto" style="width: 80px; height: 80px; background: linear-gradient(135deg, #38BDF8 0%, #2563EB 100%); border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3); transform: rotate(-5deg);">
                        <i class="bi bi-hospital-fill text-white" style="font-size: 2.5rem; transform: rotate(5deg);"></i>
                    </div>
                    
                    <!-- Titles -->
                    <h3 class="fw-bold mb-1 text-white">Bienvenue</h3>
                    <p class="text-muted small fw-bold mb-4">SGRDMS - LE TROPICAL</p>
                    
                    <!-- Form -->
                    <form method="POST" action="">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Nom d'utilisateur" required>
                            <label for="username"><i class="bi bi-person me-2"></i>Nom d'utilisateur</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Mot de passe" required>
                            <label for="password"><i class="bi bi-lock me-2"></i>Mot de passe</label>
                        </div>
                        
                        <button type="submit" class="btn btn-senegal w-100 py-3 shadow-sm login-btn rounded-3 fw-bold">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Accéder au portail
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-transparent border-0 text-center pb-4 pt-0">
                    <small class="text-muted">Système de Gestion des Rendez-vous<br>et Dossiers Médicaux</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
